name: Repair dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lockfile-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Commit audited package lock
    if: >-
      github.actor == 'mralexgarrido' &&
      github.head_ref == 'chore/public-repository-professionalization' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Repair the lockfile without changing declared ranges
        run: npm audit fix --package-lock-only

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit the repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The package lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
