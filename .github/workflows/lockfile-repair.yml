name: Repair dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lockfile-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Generate audited package lock
    if: github.head_ref == 'chore/public-repository-professionalization'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Repair the lockfile without changing declared ranges
        run: npm audit fix --package-lock-only

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload the repaired lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
